<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        background-color: rgb(100, 90, 90);
        color: white;
        text-align: center;
    }
   .cal{
    display: flex;
    flex-direction: column;
    padding: 13px;
    font-size: 20px;
    width: 252px;
    gap: 8px;
    right: 22px;
    margin:auto ; 
   }
   .btn{
    border-radius: 22px;
    padding: 6px;
    width: 122px;
    justify-content: center;
    right: 27px;
   }
   .btnn{
    display: flex;
    justify-content: center;
   }
</style>
<body>
    <h2>BMI Calculator</h2>
    <div class="cal">
   <span > Weight :  <input type="text"  id="t1" placeholder="Enter in Kg" type="number">  </span>
    <span>Height :<input type="text"  id="t2" placeholder="Enter in Cm" type="number"></span> 
    <span class="btnn">
        <button class="btn">Calculate</button>
    </span>
    <div class="result"></div>
    </div>
     <p style="font-size: 20px;">BMI Weight Guide</p>
     <p>Under Range = Less than 18</p>
     <p>Normal Range = 18 to 24</p>
     <p>Over Range = Greater than 24</p>
     <script src="script.js"></script>
</body>
</html>
